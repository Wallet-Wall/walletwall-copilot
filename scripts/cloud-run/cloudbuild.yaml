steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - scripts/cloud-run/Dockerfile
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: us-docker.pkg.dev/$PROJECT_ID/walletwall/walletwall-mcp:dev
options:
  logging: CLOUD_LOGGING_ONLY
