name: Regenerate Claude 0.3.1 integrity

on:
  push:
    branches:
      - release/claude-directory-0.3.1
    paths:
      - plugin/.claude-plugin/plugin.json
      - .github/workflows/regen-claude-0.3.1.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Regenerate plugin integrity records
        run: |
          npm run gen:plugin-manifest
          npm run gen:plugin-artifact

      - name: Commit generated integrity records
        shell: bash
        run: |
          set -euo pipefail
          git add security/plugin-manifest.json security/plugin-manifest.sha512 security/plugin-artifact.sha512
          if git diff --cached --quiet; then
            echo 'Integrity records already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate Claude 0.3.1 integrity records'
          git push origin HEAD:${GITHUB_REF_NAME}
